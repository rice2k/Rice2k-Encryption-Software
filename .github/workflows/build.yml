name: Validate Rice2k Encryption Software

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rice2k-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner_probe:
    name: Hosted runner probe (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner assignment
        shell: bash
        run: |
          echo "runner.os=${RUNNER_OS}"
          echo "runner.arch=${RUNNER_ARCH}"
          uname -a

  validate:
    name: Windows .NET 10 build and tests
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Static WPF preflight
        shell: pwsh
        run: .\tools\Static-WpfPreflight.ps1

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Record SDK environment
        shell: pwsh
        run: dotnet --info

      - name: Restore complete solution
        shell: pwsh
        run: dotnet restore Rice2kEncryption.sln

      - name: Build complete solution (Release)
        shell: pwsh
        run: dotnet build Rice2kEncryption.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run security/regression tests
        shell: pwsh
        run: dotnet test tests/Rice2k.Tests/Rice2k.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=rice2k-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rice2k-test-results-${{ github.run_number }}
          path: tests/Rice2k.Tests/TestResults/
          if-no-files-found: ignore
          retention-days: 30
