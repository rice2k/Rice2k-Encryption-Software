name: Validate Rice2k Encryption Software

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore Rice2kEncryption.sln

      - name: Build
        shell: pwsh
        run: dotnet build Rice2kEncryption.sln --configuration Release --no-restore

      - name: Run security tests
        shell: pwsh
        run: dotnet test tests/Rice2k.Tests/Rice2k.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=rice2k-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rice2k-test-results
          path: tests/Rice2k.Tests/TestResults/
          if-no-files-found: ignore
          retention-days: 14
