name: Build Rice2k Encryption Software

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        id: compile
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet --info *>&1 | Tee-Object -FilePath build.log
          dotnet restore Rice2kEncryption.sln *>&1 | Tee-Object -FilePath build.log -Append
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            dotnet build Rice2kEncryption.sln --configuration Release --no-restore *>&1 | Tee-Object -FilePath build.log -Append
            $exitCode = $LASTEXITCODE
          }
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: build.log
          retention-days: 7

      - name: Fail workflow when compilation fails
        if: steps.compile.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1
