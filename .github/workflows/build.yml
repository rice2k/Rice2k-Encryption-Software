name: Build Rice2k Encryption Software

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        id: compile
        shell: bash
        continue-on-error: true
        run: |
          set +e
          dotnet --info 2>&1 | tee build.log
          dotnet restore Rice2kEncryption.sln 2>&1 | tee -a build.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -eq 0 ]; then
            dotnet build Rice2kEncryption.sln --configuration Release --no-restore 2>&1 | tee -a build.log
            exit_code=${PIPESTATUS[0]}
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          retention-days: 7

      - name: Fail workflow when compilation fails
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
